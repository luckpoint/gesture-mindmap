<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-i18n="app.title"></title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="tokens.css">
<style id="pageStyle"></style>
<style>
/* Hallmark · app-scope: mind-map canvas · tone: soft · anchor hue: coral 35
 * genre: playful (soft end) · theme: Coral-derived · fonts: Zen Maru Gothic + BIZ UDPGothic
 * canvas: bounded-infinite ±8000 · zoom 25–200% · enrichment: none
 * pre-emit critique: P4 H4 E4 S5 R5 V4
 */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: clip; }
body {
  --side: 0px;
  background: var(--color-paper);
  color: var(--color-ink);
  font-family: var(--font-ui);
  font-size: var(--text-md);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
.delete-dialog, .keys-dialog { width: min(460px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; padding: 24px; border: 1px solid var(--color-rule); border-radius: var(--radius-lg); background: var(--color-surface); color: var(--color-ink); box-shadow: var(--shadow-2); }
.delete-dialog::backdrop, .keys-dialog::backdrop { background: oklch(31% 0.022 60 / .23); }
.delete-dialog h2, .keys-dialog h2 { margin: 0 0 12px; font: 700 21px/1.5 var(--font-display); overflow-wrap: anywhere; }
.delete-dialog p { font-size: var(--text-sm); line-height: 1.7; }
.delete-dialog__options { display: grid; gap: 12px; border: 0; padding: 0; margin: 20px 0; }
.delete-option { display: flex; align-items: start; gap: 10px; padding: 14px; border: 2px solid var(--color-rule); border-radius: var(--radius-md); cursor: pointer; }
.delete-option:has(input:checked) { border-color: var(--color-accent); background: var(--color-accent-soft); }
.delete-option input { accent-color: var(--color-accent-strong); margin: 4px 0 0; width: 18px; height: 18px; flex: none; }
.delete-option strong, .delete-option small { display: block; line-height: 1.6; }
.delete-option small { margin-top: 4px; color: var(--color-ink-2); font-size: var(--text-sm); }
.delete-dialog__actions { display: flex; justify-content: end; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
.delete-dialog__preview { background: var(--color-paper-2); padding: 12px; border-radius: var(--radius-sm); overflow-wrap: anywhere; white-space: pre-wrap; }
.keys-dialog dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin: 0 0 20px; font-size: var(--text-sm); }
.keys-dialog dt { font-weight: 700; white-space: nowrap; }
.keys-dialog dd { margin: 0; }
.image-dialog { max-width: calc(100vw - 32px); max-height: calc(100dvh - 32px); padding: 12px; border: 1px solid var(--color-rule); border-radius: var(--radius-lg); background: var(--color-surface); color: var(--color-ink); box-shadow: var(--shadow-2); }
.image-dialog::backdrop { background: oklch(31% 0.022 60 / .6); }
.image-dialog img { display: block; width: calc(100vw - 58px); height: calc(100dvh - 110px); object-fit: contain; border-radius: var(--radius-sm); }
.image-dialog form { display: flex; justify-content: end; margin-top: 12px; }
.delete-dialog :focus-visible, .keys-dialog :focus-visible, .image-dialog :focus-visible { outline: 3px solid var(--color-focus); outline-offset: 3px; }
.node.is-delete-preview { opacity: .45; outline: 3px dashed var(--color-danger); outline-offset: 4px; }
.node.is-promote-preview { outline: 3px dashed var(--color-focus); outline-offset: 4px; }
.edge.is-delete-preview { stroke-dasharray: 4 7; opacity: .4; }
.edge.is-promote-preview { stroke-dasharray: 8 5; stroke: var(--color-focus); }
[hidden] { display: none !important; }
.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ---------- canvas ---------- */
#viewport {
  position: fixed; inset: 0 var(--side) 0 0;
  touch-action: none; outline: none;
  background-color: var(--color-paper);
  background-image: radial-gradient(circle, var(--color-dot) 1.3px, transparent 1.6px);
  cursor: default;
}
#viewport.is-panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--b); stroke-linecap: round; }
.edge.is-old { stroke-dasharray: 2 10; opacity: 0.45; }
.edge.is-preview { stroke: var(--color-accent); stroke-width: 3; stroke-dasharray: 10 8; }

.node {
  position: absolute; left: 0; top: 0;
  transform: translate(var(--x), var(--y)) translate(-50%, -50%) scale(var(--lift, 1));
  width: max-content; max-width: 260px;
  padding: 10px 18px;
  background: var(--color-surface);
  border: var(--rule-2) solid var(--b);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-1);
  font-family: var(--font-display); font-weight: 500;
  font-size: var(--text-lg); line-height: 1.45;
  white-space: pre-wrap; overflow-wrap: anywhere; text-align: center;
  cursor: grab; user-select: none; -webkit-user-select: none;
  transition: box-shadow var(--dur-fast) var(--ease-out), opacity var(--dur-med) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.node.is-root {
  max-width: 360px;
  padding: 16px 28px;
  background: var(--color-accent-soft);
  border: var(--rule-3) solid var(--color-ink);
  font-size: var(--text-xl); font-weight: 700;
  border-radius: var(--radius-lg);
}
.node__text { display: block; min-width: 4em; outline: none; }
.node__text[contenteditable="plaintext-only"] { cursor: text; user-select: text; -webkit-user-select: text; }
.node__text:empty::before { content: attr(data-placeholder); color: var(--color-ink-3); }
.node.is-selected { outline: var(--rule-3) solid var(--color-accent); outline-offset: 4px; }
.node.is-editing { outline: var(--rule-3) solid var(--color-focus); outline-offset: 4px; cursor: text; }
.node.is-dragging, .node.is-grabbed { --lift: 1.04; box-shadow: var(--shadow-2); cursor: grabbing; }
.node.is-grabbable { outline: var(--rule-2) dashed var(--color-accent); outline-offset: 5px; }
.node.is-grabbed { outline: var(--rule-3) solid var(--color-accent); outline-offset: 4px; }
.node.is-lost { opacity: 0.55; outline: var(--rule-2) dashed var(--color-ink-3); outline-offset: 4px; }
.node.is-source { outline: var(--rule-3) solid var(--color-accent); outline-offset: 4px; }
.node.is-drop-target { outline: var(--rule-3) dashed var(--color-accent); outline-offset: 4px; }
.node__image { width: 192px; height: 144px; margin: 0 auto 12px; position: relative; display: grid; place-items: center; font: 14px/1.5 var(--font-ui); }
.node__image img { width: 192px; height: 144px; object-fit: contain; border-radius: var(--radius-sm); }
.node__image span { position: absolute; inset: 0; display: grid; place-items: center; }
.node.has-image { padding: 6px; }
.node.has-image .node__image { margin: 0; }
.node.has-image .node__text {
  display: none; position: absolute; left: 6px; right: 6px; bottom: 6px; max-height: calc(100% - 12px); overflow: auto;
  padding: 4px 8px; border-radius: var(--radius-sm);
  background: color-mix(in srgb, var(--color-surface) 90%, transparent); font-size: var(--text-md);
}
.node.has-image.is-selected .node__text, .node.has-image.is-editing .node__text { display: block; }
.node.is-invalid { opacity: 0.32; }
.node.is-candidate { background: var(--color-accent-soft); outline: var(--rule-3) dashed var(--color-accent); outline-offset: 5px; }
.node[data-tag]::before {
  content: attr(data-tag);
  position: absolute; left: 50%; top: 0; transform: translate(-50%, calc(-100% - 10px));
  padding: 2px 10px; border-radius: var(--radius-pill);
  background: var(--color-ink); color: var(--color-paper);
  font: 700 var(--text-xs)/1.6 var(--font-ui); white-space: nowrap;
}
.node.is-candidate::before, .node.is-grabbed::before, .node.is-grabbable::before, .node.is-source::before { background: var(--color-accent-strong); color: var(--color-on-accent); }

.edge-hint {
  position: fixed; pointer-events: none; opacity: 0;
  display: grid; place-items: center;
  color: var(--color-accent-strong); font-weight: 700; font-size: var(--text-sm);
  transition: opacity var(--dur-med) var(--ease-out);
}
.edge-hint.is-on { opacity: 1; }
.edge-hint[data-side="left"]   { left: 0; top: 0; bottom: 0; width: 56px; background: linear-gradient(to right, var(--color-accent-soft), transparent); writing-mode: vertical-rl; }
.edge-hint[data-side="right"]  { right: var(--side); top: 0; bottom: 0; width: 56px; background: linear-gradient(to left, var(--color-accent-soft), transparent); writing-mode: vertical-rl; }
.edge-hint[data-side="top"]    { left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(to bottom, var(--color-accent-soft), transparent); place-items: end center; padding-bottom: 12px; }
.edge-hint[data-side="bottom"] { left: 0; right: 0; bottom: 0; height: 160px; background: linear-gradient(to top, var(--color-accent-soft), transparent); place-items: start center; padding-top: 12px; }

/* ---------- floating panels ---------- */
.panel {
  background: var(--color-surface);
  border: var(--rule-1) solid var(--color-rule);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; min-width: 44px; padding: 0 12px;
  border: 0; border-radius: var(--radius-sm);
  background: transparent; color: var(--color-ink);
  font-weight: 700; font-size: var(--text-sm); white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--dur-fast) var(--ease-out), transform var(--dur-fast) var(--ease-out);
}
.btn:hover { background: var(--color-paper-2); }
.btn:focus-visible { outline: var(--rule-3) solid var(--color-focus); outline-offset: 2px; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.38; cursor: default; transform: none; background: transparent; }
.btn--primary { background: var(--color-accent); color: var(--color-on-accent); }
.btn--primary:hover { background: var(--color-accent-strong); }
.btn--quiet { color: var(--color-ink-2); }
.btn--danger { color: var(--color-danger); }
.btn--danger:hover { background: var(--color-danger-soft); }
.btn[aria-pressed="true"] { background: var(--color-ink); color: var(--color-paper); }
.btn--icon { padding: 0; }

.topbar {
  position: fixed; top: var(--space-sm); left: var(--space-sm); right: calc(var(--space-sm) + var(--side));
  display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-xs);
  pointer-events: none;
}
.topbar > * { pointer-events: auto; }
.cluster { display: flex; align-items: center; gap: 2px; padding: 4px; min-width: 0; }
.title {
  min-width: 0; width: 15em; max-width: 40vw;
  height: 44px; padding: 0 12px;
  border: 0; border-radius: var(--radius-sm); background: transparent; color: var(--color-ink);
  font: 700 var(--text-lg) var(--font-display);
  text-overflow: ellipsis;
}
.title:hover { background: var(--color-paper-2); }
.title:focus-visible { outline: var(--rule-3) solid var(--color-focus); outline-offset: 0; background: var(--color-surface); }
.save { display: flex; align-items: center; gap: 6px; padding: 0 10px 0 6px; color: var(--color-ink-2); font-size: var(--text-xs); white-space: nowrap; }
.save__dot { width: 8px; height: 8px; border-radius: 50%; background: var(--color-ok); flex: none; }
.save[data-state="saving"] .save__dot { background: var(--color-ink-3); }
.save[data-state="error"] { color: var(--color-danger); font-weight: 700; }
.save[data-state="error"] .save__dot { background: var(--color-danger); }
.sep { width: 1px; height: 24px; background: var(--color-rule); margin: 0 4px; }

.menu { position: relative; }
.menu__list {
  position: absolute; right: 0; top: calc(100% + 8px);
  display: grid; padding: 6px; min-width: 200px;
}
.menu__list .btn { justify-content: flex-start; }
.maps { left: 0; right: auto; width: min(340px, calc(100vw - 24px)); max-height: 60dvh; overflow: auto; }
.maps__list { list-style: none; margin: 4px 0 0; padding: 6px 0 0; border-top: 1px solid var(--color-rule); display: grid; gap: 2px; }
.maps__row { display: flex; align-items: center; gap: 2px; padding-right: 4px; border-radius: var(--radius-sm); }
.maps__row:hover { background: var(--color-paper-2); }
.maps__row--current, .maps__row--current:hover { background: var(--color-accent-soft); box-shadow: inset 3px 0 0 var(--color-accent); }
.maps__open { flex: 1; min-width: 0; display: grid !important; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; row-gap: 2px; padding: 8px 8px 8px 14px; text-align: left; white-space: normal; }
.maps__open:hover { background: transparent; }
.maps__name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.maps__size { color: var(--color-ink-2); font-size: var(--text-xs); font-weight: 400; font-variant-numeric: tabular-nums; }
.maps__meta { grid-column: 1 / -1; color: var(--color-ink-2); font-size: var(--text-xs); font-weight: 400; }
.maps__remove { color: var(--color-ink-2); opacity: 0; }
.maps__row:hover .maps__remove, .maps__row:focus-within .maps__remove { opacity: 1; }
.maps__remove:hover { color: var(--color-danger); }
@media (hover: none) { .maps__remove { opacity: 1; } }
.maps__usage { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; margin-top: 6px; padding: 10px 14px 6px; border-top: 1px solid var(--color-rule); color: var(--color-ink-2); font-size: var(--text-xs); }
.maps__usage-value { font-variant-numeric: tabular-nums; }
.maps__bar { grid-column: 1 / -1; height: 4px; border-radius: var(--radius-pill); background: var(--color-paper-2); overflow: hidden; }
.maps__bar span { display: block; height: 100%; background: var(--color-accent); }

.dock {
  position: fixed; left: calc((100% - var(--side)) / 2); bottom: max(var(--space-md), env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: flex; gap: 4px; padding: 6px; z-index: 5;
}
.dock__btn { flex-direction: column; gap: 2px; min-height: 60px; min-width: 84px; padding: 6px 12px; font-size: var(--text-xs); border-radius: var(--radius-md); }
.dock__btn .i { width: 24px; height: 24px; }
.dock__btn.btn--primary { min-width: 104px; }

.zoom { position: fixed; right: calc(var(--space-md) + var(--side)); bottom: max(var(--space-md), env(safe-area-inset-bottom)); display: flex; align-items: center; padding: 4px; gap: 2px; }
.zoom__label { min-width: 64px; font-variant-numeric: tabular-nums; }

.node-menu {
  position: fixed; left: 0; top: 0;
  display: flex; flex-wrap: wrap; max-width: calc(100vw - 24px); gap: 2px; padding: 4px;
  border-radius: var(--radius-md); box-shadow: var(--shadow-2);
  z-index: 3;
}

.banner {
  position: fixed; left: calc((100% - var(--side)) / 2); top: 72px; transform: translateX(-50%);
  display: flex; align-items: center; gap: var(--space-xs);
  padding: 6px 6px 6px 16px; max-width: calc(100vw - 24px);
  background: var(--color-accent-soft); border-color: var(--color-accent);
  font-size: var(--text-sm); z-index: 2;
}
.banner__msg { min-width: 0; }

.toast {
  position: fixed; left: calc((100% - var(--side)) / 2); bottom: calc(max(var(--space-md), env(safe-area-inset-bottom)) + 88px);
  transform: translateX(-50%);
  display: flex; align-items: center; gap: var(--space-xs);
  padding: 6px 6px 6px 16px; max-width: calc(100vw - 24px);
  background: var(--color-ink); color: var(--color-paper); border-color: var(--color-ink);
  font-size: var(--text-sm); z-index: 4;
}
.toast:not(:has(.btn)) { padding-right: 16px; min-height: 44px; }
.toast .btn { color: var(--color-paper); }
.toast .btn:hover { background: var(--color-ink-2); }

/* ---------- hand ---------- */
.hand-cursor {
  position: fixed; left: 0; top: 0; width: 40px; height: 40px; margin: -20px 0 0 -20px;
  border: var(--rule-3) solid var(--color-ink-2); border-radius: 50%;
  pointer-events: none; z-index: 5;
  display: grid; place-items: center;
  transition: width var(--dur-fast) var(--ease-out), height var(--dur-fast) var(--ease-out), margin var(--dur-fast) var(--ease-out), background-color var(--dur-fast) var(--ease-out);
}
.hand-cursor::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; color: var(--color-ink-2); }
.hand-cursor[data-state="hover"] { border-color: var(--color-accent); }
.hand-cursor[data-state="grab"] { width: 26px; height: 26px; margin: -13px 0 0 -13px; border-color: var(--color-accent-strong); background: var(--color-accent); }
.hand-cursor[data-state="grab"]::after { color: var(--color-on-accent); }
.hand-cursor[data-state="lost"] { border-style: dashed; border-color: var(--color-ink-3); }
.hand-cursor[data-state="nohand"] { display: none; }
.hand-cursor__label {
  position: absolute; top: calc(100% + 8px); left: 50%; transform: translateX(-50%);
  padding: 2px 10px; border-radius: var(--radius-pill);
  background: var(--color-ink); color: var(--color-paper);
  font-size: var(--text-xs); font-weight: 700; white-space: nowrap;
}
.hand-cursor__label:empty { display: none; }

.cam {
  position: fixed; left: var(--space-md); bottom: max(var(--space-md), env(safe-area-inset-bottom));
  width: 208px; margin: 0; padding: 6px; z-index: 1;
}
.cam__view { position: relative; aspect-ratio: 4 / 3; border-radius: var(--radius-sm); background: var(--color-cam); overflow: hidden; display: grid; place-items: center; }
.cam__view video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
.cam__msg { position: absolute; inset: 0; display: grid; place-items: center; background: #183329aa; }
.cam__msg { color: var(--color-paper); font-size: var(--text-xs); font-weight: 700; text-align: center; padding: 0 12px; line-height: 1.6; }
.cam figcaption { display: flex; justify-content: space-between; align-items: center; gap: 4px; padding: 4px 2px 0 6px; font-size: var(--text-xs); color: var(--color-ink-2); }
.cam.is-collapsed .cam__view { display: none; }

/* ---------- instruction field ---------- */
.prompt { position: fixed; left: 50%; bottom: calc(var(--kb, 0px) + 100px + env(safe-area-inset-bottom)); transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); padding: 12px; z-index: 4; }
.prompt__head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.prompt__head .btn--icon { min-height: 32px; min-width: 32px; margin: -6px -6px -6px 0; }
.prompt__target { flex: 1; min-width: 0; margin: 0 4px; font-size: var(--text-xs); color: var(--color-ink-2); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.prompt__form { display: flex; align-items: end; gap: 8px; }
.prompt__input { flex: 1; min-width: 0; min-height: 46px; max-height: 94px; resize: none; overflow-y: auto; padding: 10px 12px; border: 2px solid var(--color-rule); border-radius: var(--radius-sm); background: var(--color-paper); color: var(--color-ink); font: 16px/24px var(--font-ui); }
.prompt__input:focus-visible { outline: 3px solid var(--color-focus); outline-offset: 1px; }
.prompt__note { margin: 8px 4px 0; font-size: var(--text-xs); color: var(--color-ink-2); line-height: 1.5; }
.prompt__connection { margin: 4px 4px 0; font-size: var(--text-xs); color: var(--color-danger); }
.prompt__question { margin: 0 4px 10px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 24vh; overflow-y: auto; font-size: var(--text-sm); line-height: 1.5; }
.notices { position: fixed; top: var(--notice-top, 80px); left: 50%; transform: translateX(-50%); width: max-content; max-width: calc(100vw - 24px); display: grid; gap: 8px; z-index: 7; pointer-events: none; }
.notices .toast { position: static; transform: none; max-width: 100%; pointer-events: auto; flex-wrap: wrap; overflow-wrap: anywhere; }
.dock { bottom: calc(var(--kb, 0px) + max(var(--space-md), env(safe-area-inset-bottom))); }
body.keyboard-open .dock { display: none; }
body.keyboard-open .prompt { bottom: calc(var(--kb, 0px) + 12px + env(safe-area-inset-bottom)); }
@media (max-width: 900px) { .cam { bottom: calc(var(--kb, 0px) + var(--prompt-height, 130px) + 112px); width: 144px; } .zoom { bottom: calc(var(--kb, 0px) + var(--prompt-height, 130px) + 112px); } }
@media (max-width: 560px) { .topbar { flex-wrap: wrap; } .topbar .cluster:first-child { flex: 1; } .prompt { width: calc(100vw - 24px); } }

/* ---------- dev panel ---------- */
.dev { position: fixed; right: calc(var(--space-sm) + var(--side)); top: 72px; width: 272px; padding: var(--space-md); z-index: 3; max-height: calc(100vh - 180px); overflow: auto; }
.dev h2 { margin: 0 0 2px; font-size: var(--text-md); }
.dev p { margin: 0 0 var(--space-sm); color: var(--color-ink-2); font-size: var(--text-xs); line-height: 1.6; }
.dev h3 { margin: var(--space-sm) 0 4px; font-size: var(--text-xs); color: var(--color-ink-2); }
.dev__row { display: flex; flex-wrap: wrap; gap: 4px; }
.dev__row .btn { min-height: 36px; background: var(--color-paper-2); font-size: var(--text-xs); }
.dev__row .btn:hover { background: var(--color-rule); }

/* ---------- responsive ---------- */
@media (max-width: 720px) {
  .btn__label--wide { display: none; }
  .node-menu .btn__label { display: none; }
  .zoom { right: var(--space-sm); }

}
@media (max-width: 560px) {
  .dock { left: var(--space-sm); right: var(--space-sm); transform: none; justify-content: space-between; }
  .dock__btn, .dock__btn.btn--primary { min-width: 0; flex: 1 1 0; padding: 6px 4px; }
  .save__text { display: none; }
  .save { padding-right: 6px; }

  const d = e.target.closest('[data-dev]')?.dataset.dev;
  if (!d) return;
  if (d === 's-saving') { clearTimeout(saveTimer); setSave('saving'); }
  if (d === 's-error') { forceSaveFail = true; scheduleSave(); }
  if (d === 's-saved') { forceSaveFail = false; scheduleSave(); }
  if (d === 'edge') { animateTo(centerOn({ x: BOUND, y: 0 })); setTimeout(() => { edgeHint('right'); toast(tr('dev.edgeToast')); }, 300); }
  if (d === 'gc-skew') { try { localStorage.setItem(GC_SKEW_KEY, '1'); } catch {} toast(tr('dev.gcSkewToast')); }
  if (d === 'reset' && !readOnly()) { commit(() => { map = sample(); mapSessionId = InstructionTransport.id('map_'); }); sel = map.root; $('#title').value = map.title; animateTo(centerOn({ x: 0, y: 0 }, 1)); }
});
document.addEventListener('pointerdown', e => {
  if (!e.target.closest('#viewport')) interruptHand();
  if (!$('#fileMenu').hidden && !e.target.closest('.menu')) toggleFileMenu(false);
  if (!$('#mapsMenu').hidden && !e.target.closest('.menu')) toggleMapsMenu(false);
});
addEventListener('resize', () => { interruptHand(); clampView(view, false); applyView(); });
addEventListener('blur', () => { if (gesture?.type === 'node') revertGesture(); pts.clear(); stopHand(); });
addEventListener('pagehide', () => {
  stopHand(); for (const el of els.values()) clearNodeImage(el);
  storeView(); if (!readOnly()) flushSave().catch(() => {});
  mapClaim.release();
});
addEventListener('pageshow', e => {
  render();
  if (e?.persisted && library && mapId) void openMap(mapId).catch(failOpen);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) stopHand(); });

palette = globalThis.IconPalette?.create({
  state: () => ({ session: mapSessionId, revision, selection: map.nodes[sel] ? sel : null, root: map.root,
    targetName: map.nodes[sel]?.text || '', hasImage: !!map.nodes[sel]?.image,
    blocked: readOnly() || switching ? tr('save.readonly') : busyOperation() || instruction?.state === 'awaiting_confirmation' ? tr('palette.busy') : '' }),
  attach: (blob, target, alt) => attachNodeImage(blob, { ...target, mapSessionId: target.session }, alt),
  error: message => toast(message), interrupt: interruptHand, width: W,
  clearDrop: () => setDropTarget(null),
  closeMenu: () => toggleFileMenu(false),
  closeMenus: () => {
    if (!$('#fileMenu').hidden) { toggleFileMenu(false); return true; }
    if (!$('#mapsMenu').hidden) { toggleMapsMenu(false); return true; }
    return false;
  },
  layout: () => { animId++; resizeNotices(); if (els.has(sel)) { positionMenu(); ensureVisible(map.nodes[sel]); } },
});
$('#title').value = map.title;
function updateViewport() {
  const viewport = globalThis.visualViewport;
  const kb = viewport ? Math.max(0, innerHeight - viewport.height - viewport.offsetTop) : 0;
  document.body.style.setProperty('--kb', kb + 'px');
  document.body.classList.toggle('keyboard-open', kb > 80);
  resizePrompt();
}
globalThis.visualViewport?.addEventListener('resize', updateViewport);
globalThis.visualViewport?.addEventListener('scroll', updateViewport);
addEventListener('resize', updateViewport);
if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resizeNotices).observe($('.topbar'));
addEventListener('pagehide', cancelInstruction);
updateViewport();
void checkCodexStatus();
view = centerOn(map.nodes[map.root], 1);
view.y -= 20;
render();
applyView();
void (async () => {
  try {
    const rxdb = await import('./vendor/rxdb.js');
    library = await MapLibrary.open({ createRxDatabase: rxdb.createRxDatabase, storage: rxdb.getRxStorageDexie() });
  } catch (error) {
    console.error(error);
    mapClaim = { editable: true, release() {} }; updateAccess(); setSave('error');
    toast(tr('save.unsupportedExport')); return;
  }
  try { await library.migrateLegacy(localStorage); } catch (error) { console.error('Migration failed', error); }
  try {
    const moved = await imageStore.migrate(NodeImageStore.indexedDBLegacy());
    if (moved?.broken) console.warn(`Skipped ${moved.broken} broken images`);
  } catch (error) { console.error('Image migration failed', error); }
  navigator.storage?.persist?.().catch(() => {});
  let last = null; try { last = localStorage.getItem(LAST_KEY); } catch {}
  try { if (last && await library.load(last)) await openMap(last); else await openFallback(); } catch (error) { failOpen(error); }
  let skew = 0; try { if (localStorage.getItem(GC_SKEW_KEY)) skew = NodeImageStore.DAY; localStorage.removeItem(GC_SKEW_KEY); } catch {}
  cleanImages(Date.now() + skew).catch(error => console.error('Image cleanup failed', error));
  library.watchList(list => { mapList = list; if (!$('#mapsMenu').hidden) void refreshMapsMenu(); else renderMapList(); });
  $('#mapsBtn').disabled = false;
})();
</script>
</body>
