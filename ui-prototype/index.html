<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title data-i18n="app.title"></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="tokens.css" />
    <style id="pageStyle"></style>
    <link rel="stylesheet" href="app/app.css" />
    <link rel="stylesheet" href="icons/palette.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="i-child" viewBox="0 0 24 24">
        <circle cx="6" cy="12" r="3" />
        <path d="M9 12h4M18 8v8M14 12h8" />
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12 20 4l-6 16-3-7z" /></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" /></symbol>
      <symbol id="i-hand" viewBox="0 0 24 24">
        <path
          d="M8 13V6a1.5 1.5 0 0 1 3 0v5M11 11V4.5a1.5 1.5 0 0 1 3 0V11M14 11V6a1.5 1.5 0 0 1 3 0v7c0 4-2.5 8-6.5 8-3 0-4.5-2-6-4.5L3 13a1.5 1.5 0 0 1 2.5-1.6L8 14"
        />
      </symbol>
      <symbol id="i-icons" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="2" />
        <rect x="14" y="3" width="7" height="7" rx="2" />
        <rect x="3" y="14" width="7" height="7" rx="2" />
        <rect x="14" y="14" width="7" height="7" rx="2" />
      </symbol>
      <symbol id="i-fit" viewBox="0 0 24 24">
        <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" />
        <rect x="9" y="9" width="6" height="6" rx="1.5" />
      </symbol>
      <symbol id="i-undo" viewBox="0 0 24 24">
        <path d="M9 14 4 9l5-5" />
        <path d="M4 9h10a6 6 0 0 1 0 12h-3" />
      </symbol>
      <symbol id="i-redo" viewBox="0 0 24 24">
        <path d="m15 14 5-5-5-5" />
        <path d="M20 9H10a6 6 0 0 0 0 12h3" />
      </symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z" /></symbol>
      <symbol id="i-link" viewBox="0 0 24 24">
        <circle cx="5" cy="19" r="2" />
        <path d="M7 18c1-6 5-10 12-10M15 4l4 4-4 4" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3" /></symbol>
      <symbol id="i-image" viewBox="0 0 24 24">
        <rect x="3" y="5" width="18" height="14" rx="2" />
        <circle cx="9" cy="10" r="1.5" />
        <path d="m21 16-5-5-8 8" />
      </symbol>
      <symbol id="i-image-child" viewBox="0 0 24 24">
        <rect x="3" y="7" width="14" height="12" rx="2" />
        <path d="m17 16-4-4-6 7M20 2v6M17 5h6" />
      </symbol>
      <symbol id="i-maps" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5zM3 13l9 5 9-5" /></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4" /></symbol>
      <symbol id="i-flask" viewBox="0 0 24 24">
        <path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3" />
      </symbol>
      <symbol id="i-lock" viewBox="0 0 24 24">
        <rect x="5" y="11" width="14" height="10" rx="2" />
        <path d="M8 11V7a4 4 0 0 1 8 0v4" />
      </symbol>
      <symbol id="i-eye" viewBox="0 0 24 24">
        <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-eye-off" viewBox="0 0 24 24">
        <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z" />
        <circle cx="12" cy="12" r="3" />
        <path d="M4 4l16 16" />
      </symbol>
      <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14" /></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14" /></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14" /></symbol>
      <symbol id="i-print" viewBox="0 0 24 24">
        <path d="M7 9V3h10v6M7 17H4v-8h16v8h-3" />
        <rect x="7" y="14" width="10" height="7" />
      </symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M5 20h14" /></symbol>
    </svg>

    <main id="viewport" tabindex="0" data-i18n-aria-label="viewport.label">
      <div id="world">
        <svg id="edges" width="1" height="1"></svg>
        <div id="nodes"></div>
      </div>
    </main>
    <div class="edge-hint" id="edgeHint" aria-hidden="true" data-i18n="edge.hint"></div>

    <header class="topbar">
      <div class="cluster panel">
        <div class="menu">
          <button class="btn" id="mapsBtn" aria-expanded="false" aria-controls="mapsMenu" disabled>
            <svg class="i"><use href="#i-maps" /></svg><span class="btn__label--wide" data-i18n="maps.button"></span>
          </button>
          <div class="menu__list maps panel" id="mapsMenu" hidden>
            <button class="btn" id="newMapBtn">
              <svg class="i"><use href="#i-plus" /></svg><span data-i18n="maps.new"></span>
            </button>
            <ul class="maps__list" id="mapsList" data-i18n-aria-label="maps.list"></ul>
            <div class="maps__usage" id="mapsUsage" hidden>
              <span data-i18n="maps.usage"></span><span class="maps__usage-value" id="mapsUsageText"></span>
              <div class="maps__bar"><span id="mapsUsageBar"></span></div>
            </div>
          </div>
        </div>
        <input class="title" id="title" data-i18n-aria-label="title.label" autocomplete="off" spellcheck="false" />
        <div class="save" id="save" data-state="saving" role="status">
          <span class="save__dot"></span><span class="save__text" id="saveText" data-i18n="save.loading"></span>
        </div>
        <button class="btn btn--danger" id="saveExport" data-i18n="file.export" hidden></button>
      </div>
      <div class="cluster cluster--tools panel">
        <button
          class="btn btn--icon"
          id="undo"
          data-i18n-aria-label="history.undo"
          data-i18n-title="history.undo"
          disabled
        >
          <svg class="i"><use href="#i-undo" /></svg>
        </button>
        <button
          class="btn btn--icon"
          id="redo"
          data-i18n-aria-label="history.redo"
          data-i18n-title="history.redo"
          disabled
        >
          <svg class="i"><use href="#i-redo" /></svg>
        </button>
        <span class="sep"></span>
        <div class="menu">
          <button class="btn" id="fileBtn" aria-expanded="false" aria-controls="fileMenu">
            <svg class="i"><use href="#i-file" /></svg><span class="btn__label--wide" data-i18n="file.button"></span>
          </button>
          <div class="menu__list panel" id="fileMenu" hidden>
            <button class="btn" id="paletteToggle" aria-controls="iconPalette" aria-expanded="false" hidden></button>
            <hr class="menu__separator" id="paletteSeparator" hidden />
            <button class="btn" id="exportBtn">
              <svg class="i"><use href="#i-down" /></svg><span data-i18n="file.exportJson"></span>
            </button>
            <button class="btn" id="importBtn">
              <svg class="i"><use href="#i-up" /></svg><span data-i18n="file.import"></span>
            </button>
            <button class="btn" id="printBtn">
              <svg class="i"><use href="#i-print" /></svg><span data-i18n="file.print"></span>
            </button>
            <hr class="menu__separator menu__dev" />
            <button class="btn menu__dev" id="devMenuBtn" aria-controls="dev">
              <svg class="i"><use href="#i-flask" /></svg><span data-i18n="dev.button"></span>
            </button>
          </div>
        </div>
        <button class="btn btn--quiet" id="devBtn" aria-expanded="false" aria-controls="dev">
          <svg class="i"><use href="#i-flask" /></svg><span class="btn__label--wide" data-i18n="dev.button"></span>
        </button>
      </div>
    </header>
    <input type="file" id="fileInput" accept="application/json,.json" hidden />
    <input type="file" id="imageInput" accept="image/*" hidden />

    <div class="node-menu panel" id="nodeMenu" role="toolbar" data-i18n-aria-label="node.menu" hidden>
      <button class="btn" data-act="child">
        <svg class="i"><use href="#i-child" /></svg
        ><span class="btn__label btn__label--long" data-i18n="node.addChild"></span
        ><span class="btn__label btn__label--short" data-i18n="node.addChild.short"></span>
      </button>
      <button class="btn" data-act="edit" data-i18n-title="node.editTitle">
        <svg class="i"><use href="#i-edit" /></svg><span class="btn__label" data-i18n="node.edit"></span>
      </button>
      <button class="btn" data-act="image-child">
        <svg class="i"><use href="#i-image-child" /></svg
        ><span class="btn__label btn__label--long" data-i18n="node.imageChild"></span
        ><span class="btn__label btn__label--short" data-i18n="node.imageChild.short"></span>
      </button>
      <button class="btn" data-act="image">
        <svg class="i"><use href="#i-image" /></svg
        ><span class="btn__label btn__label--long" data-i18n="node.image"></span
        ><span class="btn__label btn__label--short" data-i18n="node.image.short"></span>
      </button>
      <button class="btn" data-act="remove-image" data-i18n="node.removeImage" hidden></button>
      <button class="btn" data-act="reparent">
        <svg class="i"><use href="#i-link" /></svg
        ><span class="btn__label btn__label--long" data-i18n="node.reparent"></span
        ><span class="btn__label btn__label--short" data-i18n="node.reparent.short"></span>
      </button>
      <button class="btn btn--danger btn--icon" data-act="delete" data-i18n-aria-label="node.delete">
        <svg class="i"><use href="#i-trash" /></svg>
      </button>
    </div>

    <div class="banner panel" id="modeBanner" role="status" hidden>
      <span class="banner__msg" id="modeMsg"></span>
      <button class="btn btn--primary" id="modeOk" data-i18n="reparent.ok" disabled></button>
      <button class="btn" id="modeCancel" data-i18n="reparent.cancel"></button>
    </div>

    <div class="notices" id="notices">
      <div class="toast panel" id="instructionToast" role="status" aria-live="polite" hidden></div>
      <div class="toast panel" id="toast" role="status" aria-live="polite" hidden></div>
    </div>
    <dialog class="delete-dialog" id="instructionDialog" aria-labelledby="instructionTitle">
      <h2 id="instructionTitle" data-i18n="instruction.confirmTitle"></h2>
      <p data-i18n="instruction.confirmBody"></p>
      <div id="instructionScopes"></div>
      <p class="delete-dialog__preview" id="instructionPreview" role="status" aria-live="polite"></p>
      <div class="delete-dialog__actions">
        <button class="btn" id="instructionCancel" data-i18n="common.cancel"></button
        ><button class="btn btn--danger" id="instructionConfirm" data-i18n="instruction.applyAll"></button>
      </div>
    </dialog>

    <dialog class="delete-dialog" id="deleteDialog" aria-labelledby="deleteTitle" aria-describedby="deleteDescription">
      <h2 id="deleteTitle"></h2>
      <p id="deleteDescription"></p>
      <fieldset class="delete-dialog__options" id="deleteOptions">
        <legend style="font-size: 14px; margin-bottom: 8px" data-i18n="delete.legend"></legend>
        <label class="delete-option"
          ><input type="radio" name="deleteScope" id="deleteSingle" value="single" /><span
            ><strong data-i18n="delete.singleOption"></strong><small id="deleteSingleDetail"></small></span
        ></label>
        <label class="delete-option"
          ><input type="radio" name="deleteScope" id="deleteBranch" value="branch" /><span
            ><strong data-i18n="delete.branchOption"></strong><small id="deleteBranchDetail"></small></span
        ></label>
      </fieldset>
      <p class="delete-dialog__preview" id="deletePreview" aria-live="polite"></p>
      <p id="deleteHandHelp" data-i18n="delete.handHelp"></p>
      <div class="delete-dialog__actions">
        <button class="btn" id="deleteCancel" data-i18n="common.cancel" autofocus></button>
        <button class="btn btn--danger" id="deleteConfirm" disabled></button>
      </div>
    </dialog>

    <dialog class="delete-dialog" id="mapDeleteDialog" aria-labelledby="mapDeleteTitle">
      <h2 id="mapDeleteTitle"></h2>
      <p data-i18n="maps.deleteBody"></p>
      <div class="delete-dialog__actions">
        <button class="btn" id="mapDeleteCancel" data-i18n="common.cancel" autofocus></button>
        <button class="btn btn--danger" id="mapDeleteConfirm" data-i18n="common.delete"></button>
      </div>
    </dialog>

    <dialog class="image-dialog" id="imageDialog" data-i18n-aria-label="image.viewer">
      <img id="imageViewerImg" alt="" />
      <form method="dialog"><button class="btn" data-i18n="common.close"></button></form>
    </dialog>

    <dialog class="keys-dialog" id="keysDialog" aria-labelledby="keysTitle">
      <h2 id="keysTitle" data-i18n="keys.title"></h2>
      <dl>
        <dt>Space</dt>
        <dd data-i18n="keys.editAll"></dd>
        <dt>⇧Space / F2</dt>
        <dd data-i18n="keys.editEnd"></dd>
        <dt>Enter</dt>
        <dd data-i18n="keys.addSibling"></dd>
        <dt>Tab</dt>
        <dd data-i18n="node.addChild"></dd>
        <dt>Delete</dt>
        <dd data-i18n="node.delete"></dd>
        <dt data-i18n="keys.arrows"></dt>
        <dd data-i18n="keys.arrowsHelp"></dd>
        <dt data-i18n="keys.sideBranch"></dt>
        <dd data-i18n="keys.sideBranchHelp"></dd>
        <dt data-i18n="keys.verticalBranch"></dt>
        <dd data-i18n="keys.verticalBranchHelp"></dd>
        <dt data-i18n="keys.toChild"></dt>
        <dd data-i18n="keys.toChildHelp"></dd>
        <dt>⌘Z / ⇧⌘Z</dt>
        <dd data-i18n="keys.undoRedo"></dd>
        <dt>⌘P</dt>
        <dd data-i18n="keys.print"></dd>
        <dt>⇧1</dt>
        <dd data-i18n="view.fit"></dd>
        <dt>⇧2</dt>
        <dd data-i18n="keys.focus"></dd>
        <dt>⌘= / ⌘-</dt>
        <dd data-i18n="keys.zoom"></dd>
        <dt>⌘0</dt>
        <dd data-i18n="keys.reset"></dd>
        <dt id="promptShortcutKey" hidden>⌘K</dt>
        <dd id="promptShortcutHelp" data-i18n="keys.prompt" hidden></dd>
        <dt>⇧H</dt>
        <dd data-i18n="keys.hand"></dd>
        <dt>?</dt>
        <dd data-i18n="keys.help"></dd>
      </dl>
      <form method="dialog"><button class="btn" data-i18n="common.close"></button></form>
    </dialog>

    <nav class="dock panel" data-i18n-aria-label="dock.label">
      <button class="btn dock__btn" id="addChild">
        <svg class="i"><use href="#i-child" /></svg><span data-i18n="node.addChild"></span>
      </button>
      <button
        class="btn dock__btn"
        id="promptToggle"
        hidden
        aria-expanded="false"
        aria-controls="prompt"
        data-i18n-title="prompt.toggleTitle"
      >
        <svg class="i"><use href="#i-send" /></svg><span data-i18n="prompt.toggle"></span>
      </button>
      <button class="btn dock__btn" id="handBtn" aria-pressed="false" data-i18n-title="hand.buttonTitle">
        <svg class="i"><use href="#i-hand" /></svg><span data-i18n="hand.button"></span>
      </button>
      <button
        class="btn dock__btn"
        id="paletteDockToggle"
        hidden
        aria-expanded="false"
        aria-controls="iconPalette"
        data-i18n-aria-label="palette.show"
        data-i18n-title="palette.show"
      >
        <svg class="i"><use href="#i-icons" /></svg><span data-i18n="palette.button"></span>
      </button>
      <button class="btn dock__btn" id="fitBtn" data-i18n-title="view.fitTitle">
        <svg class="i"><use href="#i-fit" /></svg><span data-i18n="view.fit"></span>
      </button>
    </nav>

    <div class="zoom panel" role="group" data-i18n-aria-label="zoom.label">
      <button class="btn btn--icon" id="zoomOut" data-i18n-aria-label="zoom.out" data-i18n-title="zoom.outTitle">
        <svg class="i"><use href="#i-minus" /></svg>
      </button>
      <button class="btn zoom__label" id="zoomLabel" data-i18n-title="zoom.resetTitle">100%</button>
      <button class="btn btn--icon" id="zoomIn" data-i18n-aria-label="zoom.in" data-i18n-title="zoom.inTitle">
        <svg class="i"><use href="#i-plus" /></svg>
      </button>
    </div>

    <section class="speech panel" id="nodeSpeech" hidden data-i18n-aria-label="speech.start">
      <button class="btn" id="nodeSpeechToggle" type="button" aria-describedby="speechNote"></button>
      <button class="btn" id="nodeSpeechDone" type="button" data-i18n="speech.done"></button>
      <button class="btn" id="nodeSpeechCancel" type="button" data-i18n="common.cancel"></button>
      <p id="speechStatus" role="status" aria-live="polite"></p>
      <p id="speechInterim"></p>
      <p id="speechNote" data-i18n="speech.note"></p>
    </section>

    <figure class="cam panel is-video-off" id="cam" hidden>
      <div class="cam__view">
        <video id="camVideo" autoplay muted playsinline data-i18n-aria-label="cam.preview"></video>
        <canvas class="cam__skeleton" id="handShape" aria-hidden="true"></canvas>
        <canvas class="cam__skeleton" id="handSkeleton" aria-hidden="true" hidden></canvas>
        <span class="cam__pose" id="handPose" aria-hidden="true"></span>
        <span class="cam__msg" id="camMsg" role="status" aria-live="polite" hidden></span>
        <span class="cam__progress" id="handProgress" aria-hidden="true"></span>
        <button
          class="btn btn--icon"
          id="camVideoToggle"
          aria-pressed="false"
          data-i18n-aria-label="cam.videoShow"
          data-i18n-title="cam.videoShow"
        >
          <svg class="i"><use href="#i-eye-off" /></svg>
        </button>
        <button class="btn btn--icon" id="camToggle" data-i18n-aria-label="cam.hide" data-i18n-title="cam.hide">
          <svg class="i"><use href="#i-minus" /></svg>
        </button>
      </div>
      <figcaption>
        <span id="handHelp" role="status" aria-live="polite"></span>
        <span class="cam__lock" role="img" data-i18n-aria-label="cam.status" data-i18n-title="cam.status"
          ><svg class="i"><use href="#i-lock" /></svg
        ></span>
        <button
          class="btn btn--quiet btn--icon"
          id="handGuideToggle"
          aria-expanded="false"
          aria-controls="handGuide"
          data-i18n-aria-label="cam.guide"
          data-i18n-title="cam.guide"
        >
          ?
        </button>
      </figcaption>
      <ul class="cam__tips" id="handTips"></ul>
      <ul class="cam__tips cam__guide" id="handGuide" hidden></ul>
      <select
        id="camSelect"
        data-i18n-aria-label="cam.select"
        hidden
        style="width: 100%; margin-top: 4px; font-size: var(--text-xs)"
      ></select>
    </figure>
    <div class="hand-cursor" id="handCursor" hidden><span class="hand-cursor__label" id="handLabel"></span></div>

    <section class="prompt panel" id="prompt" data-i18n-aria-label="prompt.label" hidden>
      <div class="prompt__head">
        <p class="prompt__target" id="promptTarget"></p>
        <button
          class="btn btn--icon btn--quiet"
          id="promptHide"
          data-i18n-aria-label="prompt.hide"
          data-i18n-title="prompt.hide"
        >
          <svg class="i"><use href="#i-close" /></svg>
        </button>
      </div>
      <p class="prompt__question" id="promptQuestion" role="status" aria-live="polite" hidden></p>
      <form class="prompt__form" id="promptForm">
        <textarea
          class="prompt__input"
          id="promptInput"
          rows="1"
          maxlength="4000"
          data-i18n-aria-label="prompt.label"
          data-i18n-placeholder="prompt.placeholder"
          aria-describedby="promptQuestion promptNote promptConnection"
        ></textarea>
        <button class="btn btn--primary" id="promptSend" type="submit" data-i18n="prompt.send"></button>
      </form>
      <p class="prompt__note" id="promptNote" data-i18n="prompt.note"></p>
      <p class="prompt__connection" id="promptConnection" role="status" hidden></p>
    </section>

    <aside class="dev panel" id="dev" data-i18n-aria-label="dev.title" hidden>
      <h2 data-i18n="dev.title"></h2>
      <p data-i18n="dev.note"></p>
      <h3 data-i18n="hand.button"></h3>
      <div class="dev__row">
        <button class="btn" id="handFallback" data-i18n="dev.fallback"></button>
        <button
          class="btn"
          id="handDebugToggle"
          aria-pressed="false"
          aria-controls="handSkeleton handDebugValues"
          data-i18n="cam.debug"
        ></button>
      </div>
      <output class="dev__metrics" id="handMetrics" data-i18n="dev.unmeasured"></output>
      <pre class="dev__debug" id="handDebugValues" hidden></pre>
      <h3 data-i18n="dev.save"></h3>
      <div class="dev__row">
        <button class="btn" data-dev="s-saving" data-i18n="save.saving"></button>
        <button class="btn" data-dev="s-error" data-i18n="save.error"></button>
        <button class="btn" data-dev="s-saved" data-i18n="save.saved"></button>
      </div>
      <h3 data-i18n="dev.canvas"></h3>
      <div class="dev__row">
        <button class="btn" data-dev="edge" data-i18n="dev.edge"></button>
        <button class="btn" data-dev="reset" data-i18n="dev.reset"></button>
      </div>
      <h3 data-i18n="dev.images"></h3>
      <div class="dev__row">
        <button class="btn" data-dev="gc-skew" data-i18n="dev.gcSkew"></button>
      </div>
    </aside>

    <aside class="icon-palette" id="iconPalette" data-i18n-aria-label="palette.title" aria-hidden="true" inert>
      <div class="palette__header">
        <div class="palette__heading">
          <h2 data-i18n="palette.title"></h2>
          <button class="btn btn--icon" id="paletteClose" data-i18n-aria-label="common.close">
            <svg class="i"><use href="#i-close" /></svg>
          </button>
