<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title data-i18n="landing.title"></title>
    <meta name="description" data-i18n-content="landing.description" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mindmap.luckpoint.jp/landing" />
    <meta property="og:title" content="手で広げるマインドマップ" />
    <meta
      property="og:description"
      content="ブラウザで動くマインドマップ。マウスやタッチに加えて、カメラに映した手のジェスチャーでもノードを追加・削除できます。"
    />
    <meta property="og:image" content="https://mindmap.luckpoint.jp/landing/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="627" />
    <meta property="og:locale" content="ja_JP" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap"
    />
    <link rel="stylesheet" href="tokens.css" />
    <style>
      /* Hallmark · macrostructure: Marquee Hero · tone: playful (soft) · anchor hue: 35 (coral)
 * theme: Coral-derived (app tokens.css) · nav: N1a · footer: Ft5 statement · enrichment: real app screenshots
 */
      :root {
        --text-display: clamp(2.25rem, 1.4rem + 4.2vw, 4.25rem);
        --text-2xl: clamp(1.625rem, 1.2rem + 1.8vw, 2.5rem);
        --space-2xl: 48px;
        --space-3xl: 80px;
        --measure: 34rem;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        overflow-x: clip;
      }
      body {
        margin: 0;
        background: var(--color-paper);
        color: var(--color-ink);
        font: var(--text-md)/1.8 var(--font-ui);
      }
      img {
        display: block;
        max-width: 100%;
        height: auto;
      }
      h1,
      h2,
      h3 {
        font-family: var(--font-display);
        font-weight: 700;
        font-style: normal;
        line-height: 1.25;
        margin: 0;
        overflow-wrap: anywhere;
        min-width: 0;
      }
      p {
        margin: 0;
      }
      .wrap {
        width: min(1120px, 100% - 2 * var(--space-md));
        margin-inline: auto;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        gap: var(--space-xs);
        min-height: var(--touch);
        padding: 0 var(--space-lg);
        border-radius: var(--radius-pill);
        background: var(--color-accent-strong);
        color: var(--color-on-accent);
        font: 700 var(--text-md)/1 var(--font-display);
        text-decoration: none;
        white-space: nowrap;
        box-shadow: var(--shadow-1);
        transition:
          transform var(--dur-fast) var(--ease-out),
          box-shadow var(--dur-fast) var(--ease-out);
      }
      .cta:hover {
        transform: translateY(-1px);
        box-shadow: var(--shadow-2);
      }
      .cta:active {
        transform: translateY(0);
        box-shadow: var(--shadow-1);
      }
      .cta:focus-visible,
      .nav a:focus-visible {
        outline: var(--rule-3) solid var(--color-focus);
        outline-offset: 3px;
      }
      .cta svg {
        width: 18px;
        height: 18px;
      }

      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-md);
        padding-block: var(--space-md);
      }
      .brand {
        font: 700 var(--text-lg)/1.3 var(--font-display);
        min-width: 0;
      }
      .nav a {
        color: var(--color-ink-2);
        font-size: var(--text-sm);
        white-space: nowrap;
        text-underline-offset: 4px;
      }

      .hero {
        background-color: var(--color-paper);
        background-image: radial-gradient(var(--color-dot) 1.2px, transparent 1.4px);
        background-size: 22px 22px;
        padding-bottom: var(--space-3xl);
      }
      .hero-copy {
        padding-block: var(--space-2xl) var(--space-xl);
        display: grid;
        gap: var(--space-lg);
        justify-items: start;
      }
      .hero h1 {
        font-size: var(--text-display);
        letter-spacing: 0.01em;
      }
      .hero h1 .mark {
        color: var(--color-accent-strong);
      }
      .lede {
        max-width: var(--measure);
        color: var(--color-ink-2);
        font-size: var(--text-lg);
      }
      .note {
        color: var(--color-ink-3);
        font-size: var(--text-sm);
      }
      .shot {
        margin: 0;
        border: var(--rule-1) solid var(--color-rule);
        border-radius: var(--radius-lg);
        overflow: hidden;
        background: var(--color-surface);
        box-shadow: var(--shadow-2);
      }

      .hands {
        background: var(--color-cam);
        color: var(--color-paper);
        padding-block: var(--space-3xl);
      }
      .hands-head {
        display: grid;
        gap: var(--space-md);
        max-width: var(--measure);
        margin-bottom: var(--space-2xl);
      }
      .hands h2 {
        font-size: var(--text-2xl);
      }
      .hands-head p {
        color: var(--color-dot);
      }
      .poses {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 15rem), 1fr));
        gap: var(--space-sm);
      }
      .poses li {
        display: grid;
        grid-template-columns: 4rem minmax(0, 1fr);
        align-items: center;
        gap: var(--space-sm);
        padding: var(--space-md);
        border: var(--rule-1) solid var(--color-ink-2);
        border-radius: var(--radius-md);
      }
      .poses .emoji {
        font-size: 2rem;
        line-height: 1;
        text-align: center;
        white-space: nowrap;
      }
      .poses b {
        display: block;
        font: 700 var(--text-md)/1.4 var(--font-display);
        color: var(--color-cam-line);
      }
      .poses span {
        font-size: var(--text-sm);
        color: var(--color-dot);
        line-height: 1.6;
      }
      .honest {
        margin-top: var(--space-xl);
        padding-left: var(--space-md);
        border-left: var(--rule-3) solid var(--color-cam-line);
        max-width: var(--measure);
        color: var(--color-paper);
      }

      .demo {
        padding-block: var(--space-3xl);
      }
      .demo-head {
        display: grid;
        gap: var(--space-md);
        max-width: var(--measure);
        margin-bottom: var(--space-2xl);
      }
      .demo h2 {
        font-size: var(--text-2xl);
      }
      .demo-head p {
        color: var(--color-ink-2);
      }
      .steps {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(100%, 26rem), 1fr));
        gap: var(--space-2xl) var(--space-xl);
        counter-reset: step;
      }
      .steps li {
        display: grid;
        gap: var(--space-sm);
        align-content: start;
        counter-increment: step;
      }
      .steps h3 {
        display: flex;
        align-items: center;
        gap: var(--space-sm);
        font-size: var(--text-lg);
      }
      .steps h3::before {
        content: counter(step);
        display: grid;
        place-items: center;
        flex: none;
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        background: var(--color-accent-strong);
        color: var(--color-on-accent);
        font-size: var(--text-md);
      }
      .steps p {
        color: var(--color-ink-2);
        font-size: var(--text-sm);
      }

      .more {
        padding-block: var(--space-3xl);
      }
      .more-grid {
        display: grid;
        grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
        gap: var(--space-2xl);
        align-items: center;
      }
      .more h2 {
        font-size: var(--text-2xl);
        margin-bottom: var(--space-lg);
      }
      .more dl {
        margin: 0;
        display: grid;
        gap: var(--space-lg);
      }
      .more dt {
        font: 700 var(--text-lg)/1.4 var(--font-display);
      }
      .more dd {
        margin: var(--space-2xs) 0 0;
        color: var(--color-ink-2);
      }

      .end {
        border-top: var(--rule-1) solid var(--color-rule);
        padding-block: var(--space-3xl) var(--space-2xl);
        display: grid;
        gap: var(--space-lg);
        justify-items: start;
      }
      .end p.big {
        font: 700 var(--text-2xl)/1.3 var(--font-display);
      }
      .foot {
        border-top: var(--rule-1) solid var(--color-rule);
        padding-block: var(--space-lg);
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-sm) var(--space-lg);
        color: var(--color-ink-3);
        font-size: var(--text-sm);
      }
      .foot nav {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-xs) var(--space-lg);
      }
      .foot a {
        color: var(--color-ink-2);
        text-underline-offset: 4px;
      }
      .foot a:focus-visible {
        outline: var(--rule-3) solid var(--color-focus);
        outline-offset: 3px;
      }

      @media (max-width: 768px) {
        .more-grid {
          grid-template-columns: minmax(0, 1fr);
          gap: var(--space-xl);
        }
        .hero {
          padding-bottom: var(--space-2xl);
        }
        .hands,
        .demo,
        .more {
          padding-block: var(--space-2xl);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cta {
          transition: none;
        }
        .cta:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <div class="wrap">
        <nav class="nav">
          <span class="brand" data-i18n="landing.brand"></span>
          <a href="/" data-i18n="landing.nav"></a>
        </nav>
        <div class="hero-copy">
          <h1><span data-i18n="landing.heroA"></span><br /><span class="mark" data-i18n="landing.heroB"></span></h1>
          <p class="lede" data-i18n="landing.lede"></p>
          <a class="cta" href="/"
            ><span data-i18n="landing.cta"></span
            ><svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M5 12h14M13 6l6 6-6 6" /></svg
          ></a>
          <p class="note" data-i18n="landing.ctaNote"></p>
        </div>
        <figure class="shot">
          <img data-i18n-src="landing.mapSrc" width="1440" height="900" data-i18n-alt="landing.mapAlt" alt="" />
        </figure>
      </div>
    </header>

    <main>
      <section class="hands" aria-labelledby="hands-title">
        <div class="wrap">
          <div class="hands-head">
            <h2 id="hands-title" data-i18n="landing.handsTitle"></h2>
            <p data-i18n="landing.handsLede"></p>
          </div>
          <ul class="poses">
            <li>
              <span class="emoji" aria-hidden="true">✋</span>
              <p><b data-i18n="landing.palm"></b><span data-i18n="landing.palmDo"></span></p>
            </li>
            <li>
              <span class="emoji" aria-hidden="true">✌️</span>
              <p><b data-i18n="landing.peace"></b><span data-i18n="landing.peaceDo"></span></p>
            </li>
            <li>
              <span class="emoji" aria-hidden="true">👎</span>
              <p><b data-i18n="landing.thumbDown"></b><span data-i18n="landing.thumbDownDo"></span></p>
            </li>
            <li>
              <span class="emoji" aria-hidden="true">🤏</span>
              <p><b data-i18n="landing.pinch"></b><span data-i18n="landing.pinchDo"></span></p>
            </li>
            <li>
              <span class="emoji" aria-hidden="true">✊</span>
              <p><b data-i18n="landing.fist"></b><span data-i18n="landing.fistDo"></span></p>
            </li>
            <li>
              <span class="emoji" aria-hidden="true">✊✊</span>
              <p><b data-i18n="landing.bothFists"></b><span data-i18n="landing.bothFistsDo"></span></p>
            </li>
            <li>
              <span class="emoji" aria-hidden="true">✕</span>
              <p><b data-i18n="landing.cross"></b><span data-i18n="landing.crossDo"></span></p>
            </li>
          </ul>
          <p class="honest" data-i18n="landing.honest"></p>
        </div>
      </section>

      <section class="demo" aria-labelledby="demo-title">
        <div class="wrap">
          <div class="demo-head">
            <h2 id="demo-title" data-i18n="landing.demoTitle"></h2>
            <p data-i18n="landing.demoLede"></p>
          </div>
          <ol class="steps">
            <li>
              <figure class="shot">
                <img
                  data-i18n-src="landing.step1Src"
                  width="1000"
                  height="763"
                  loading="lazy"
                  data-i18n-alt="landing.step1Alt"
                  alt=""
                />
              </figure>
              <h3 data-i18n="landing.step1"></h3>
              <p data-i18n="landing.step1Do"></p>
            </li>
            <li>
              <figure class="shot">
                <img
                  data-i18n-src="landing.step2Src"
                  width="1000"
                  height="763"
                  loading="lazy"
                  data-i18n-alt="landing.step2Alt"
                  alt=""
                />
              </figure>
              <h3 data-i18n="landing.step2"></h3>
              <p data-i18n="landing.step2Do"></p>
            </li>
            <li>
              <figure class="shot">
                <img
                  data-i18n-src="landing.step3Src"
                  width="1000"
                  height="763"
                  loading="lazy"
                  data-i18n-alt="landing.step3Alt"
                  alt=""
                />
              </figure>
              <h3 data-i18n="landing.step3"></h3>
              <p data-i18n="landing.step3Do"></p>
            </li>
            <li>
              <figure class="shot">
                <img
                  data-i18n-src="landing.step4Src"
                  width="1000"
                  height="763"
                  loading="lazy"
                  data-i18n-alt="landing.step4Alt"
                  alt=""
                />
              </figure>
              <h3 data-i18n="landing.step4"></h3>
              <p data-i18n="landing.step4Do"></p>
            </li>
            <li>
              <figure class="shot">
                <img
                  data-i18n-src="landing.step5Src"
                  width="1000"
                  height="763"
                  loading="lazy"
                  data-i18n-alt="landing.step5Alt"
                  alt=""
                />
              </figure>
              <h3 data-i18n="landing.step5"></h3>
              <p data-i18n="landing.step5Do"></p>
            </li>
          </ol>
        </div>
      </section>

      <section class="more" aria-labelledby="more-title">
        <div class="wrap more-grid">
          <div>
            <h2 id="more-title" data-i18n="landing.moreTitle"></h2>
            <dl>
              <div>
                <dt data-i18n="landing.icons"></dt>
                <dd data-i18n="landing.iconsDo"></dd>
              </div>
              <div>
                <dt data-i18n="landing.voice"></dt>
                <dd data-i18n="landing.voiceDo"></dd>
              </div>
              <div>
                <dt data-i18n="landing.maps"></dt>
                <dd data-i18n="landing.mapsDo"></dd>
              </div>
            </dl>
          </div>
          <figure class="shot">
            <img
              data-i18n-src="landing.iconsSrc"
              width="1440"
              height="900"
              loading="lazy"
              data-i18n-alt="landing.iconsAlt"
              alt=""
            />
          </figure>
        </div>
      </section>
    </main>

    <footer class="wrap end">
      <p class="big" data-i18n="landing.end"></p>
      <a class="cta" href="/"
        ><span data-i18n="landing.cta"></span
        ><svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M5 12h14M13 6l6 6-6 6" /></svg
      ></a>
      <p class="note" data-i18n="landing.endNote"></p>
    </footer>
    <footer class="wrap foot">
      <nav data-i18n-aria-label="landing.legalAria">
        <a data-i18n-href="landing.termsHref" href="/legal/en/terms" data-i18n="landing.terms"></a>
        <a data-i18n-href="landing.privacyHref" href="/legal/en/privacy" data-i18n="landing.privacy"></a>
      </nav>
      <span>© 2026 Luckpoint Factory</span>
    </footer>
    <script src="i18n.js"></script>
  </body>
</html>
